<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#00b8b8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kasse" />

    <!-- PWA Manifest -->
    <!-- crossorigin="use-credentials": ohne das schickt Chrome beim Laden
         des Manifests keine Cookies mit. Hinter Cloudflare Access bekommt
         Chrome dann statt JSON die Login-Seite zurück und erkennt die App
         deshalb nicht als installierbare PWA (nur "Zur Startseite
         hinzufügen" statt "App installieren"). -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Kasse 🛒</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      // Startup diagnostics: show a visible recovery UI if a stale module or a
      // Safari loading error prevents React from mounting. Never clear app data.
      (function () {
        var lastError = '';
        function record(error) {
          if (typeof error === 'string') lastError = error;
          else if (error && error.message) lastError = String(error.message);
        }
        window.addEventListener('error', function (event) {
          record(event.message || (event.target && event.target.src ? 'Datei konnte nicht geladen werden' : 'Startfehler'));
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          record(event.reason);
        });
        window.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (!root || root.children.length > 0) return;
            var box = document.createElement('main');
            box.style.cssText = 'max-width:460px;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif;color:#1f2937;text-align:center';
            var heading = document.createElement('h1');
            heading.textContent = 'KinderKasse konnte nicht starten';
            var description = document.createElement('p');
            description.textContent = 'Bitte die Seite neu laden. Deine gespeicherten Kassendaten werden dabei nicht gelöscht.';
            var reload = document.createElement('button');
            reload.textContent = 'Neu laden';
            reload.style.cssText = 'min-height:48px;padding:12px 24px;border:0;border-radius:10px;background:#146b38;color:white;font-weight:700;font-size:16px';
            reload.addEventListener('click', function () {
              var target = new URL(window.location.href);
              target.searchParams.set('kasse_refresh', String(Date.now()));
              window.location.replace(target.toString());
            });
            var hint = document.createElement('p');
            hint.style.cssText = 'font-size:12px;overflow-wrap:anywhere;color:#6b7280;margin-top:18px';
            hint.textContent = lastError ? 'Hinweis: ' + lastError : 'Frontend-Dateien konnten nicht geladen werden.';
            box.appendChild(heading); box.appendChild(description); box.appendChild(reload); box.appendChild(hint);
            root.appendChild(box);
          }, 8000);
        });
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Do not force landscape: the customer display supports iPhones in portrait.
      // The register page shows its own orientation hint where appropriate.
      // Service Worker registrieren
      // Erzwingt ein Update, falls eine ältere (fehlerhafte) SW-Version im
      // Browser-Cache hängt — wichtig nach dem Fix für Cloudflare Access,
      // da alte Service-Worker-Versionen sonst weiter aktiv bleiben können.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          console.log('SW registered:', reg.scope);
          reg.update(); // sofort auf neue Version prüfen
        }).catch(err => {
          console.log('SW registration failed:', err);
        });
      }
    </script>
  </body>
</html>
